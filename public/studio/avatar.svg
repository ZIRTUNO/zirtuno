  --cp-honey: color-mix(in oklab, var(--cp-coral), #ffd38a calc(var(--cp-gold) * 100%));
  --cp-rose: color-mix(in oklab, var(--cp-honey), #ffacc7 calc(var(--cp-blush) * 100%));
  color: color-mix(in oklab, var(--cp-rose), var(--color-paper) calc(var(--cp-glow) * 45%));
